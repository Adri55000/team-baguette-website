
services:
  backend:
    volumes:
      - ./backend/app:/app/app:ro

    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/app

    environment:
      WATCHFILES_FORCE_POLLING: "true"
